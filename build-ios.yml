name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: |
          npm install

      - name: 📂 Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json www/ 2>/dev/null || true
          cp -r css js data assets www/ 2>/dev/null || true
          echo "Web directory contents:"
          ls -la www

      - name: 📱 Initialize and Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🛡️ Configure iOS Permissions (Microphone & Speech)
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Rio Languages cần truy cập microphone để luyện phát âm và trò chuyện AI.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Rio Languages cần truy cập microphone để luyện phát âm và trò chuyện AI.'" "$PLIST"
            
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Rio Languages cần nhận diện giọng nói để đánh giá phát âm tiếng Anh và tiếng Trung.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Rio Languages cần nhận diện giọng nói để đánh giá phát âm tiếng Anh và tiếng Trung.'" "$PLIST"
            
            echo "Info.plist updated with microphone permissions successfully."
          fi

      - name: 🔨 Compile and Archive iOS App (Xcode)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 📦 Package into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r RioLanguages.ipa Payload
          ls -lh RioLanguages.ipa

      - name: 🚀 Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RioLanguages-iOS-IPA
          path: build/RioLanguages.ipa
          retention-days: 14
